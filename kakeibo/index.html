<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d">
<title>ふたりの家計</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ふたりの家計</h1>
  <div class="month">
    <button id="prevMonth" aria-label="前の月">‹</button>
    <span id="monthLabel"></span>
    <button id="nextMonth" aria-label="次の月">›</button>
  </div>
</header>

<main>
  <!-- 精算 -->
  <section id="tab-summary" class="tab active">
    <div class="card settle">
      <div id="settleText" class="settle-text"></div>
      <div id="settleSub" class="muted"></div>
      <div class="row gap">
        <button id="copySettle" class="ghost">精算メッセージをコピー</button>
        <button id="toggleSettled" class="primary"></button>
      </div>
    </div>
    <div id="fixedPending" class="card notice hidden"></div>
    <div class="card">
      <h2>内訳</h2>
      <table class="breakdown"><thead><tr><th>カテゴリ</th><th>合計</th><th class="nameA"></th><th class="nameB"></th></tr></thead><tbody id="breakdown"></tbody></table>
      <div id="paidLine" class="muted small"></div>
    </div>
    <div class="card">
      <h2>支出一覧</h2>
      <ul id="list" class="list"></ul>
    </div>
  </section>

  <!-- 入力 -->
  <section id="tab-add" class="tab">
    <div class="card">
      <label class="receipt-btn">
        📷 レシートを撮る / 選ぶ
        <input id="receipt" type="file" accept="image/*" capture="environment" hidden>
      </label>
      <div id="ocrStatus" class="muted small"></div>
      <img id="receiptPreview" class="preview hidden" alt="">
    </div>
    <form id="form" class="card">
      <input type="hidden" id="editId">
      <label>金額（円）<input id="amount" type="number" inputmode="numeric" min="1" required></label>
      <label>カテゴリ</label>
      <div id="catChips" class="chips"></div>
      <label>払った人</label>
      <div id="payerChips" class="chips"></div>
      <label>負担割合 <span id="ratioLabel" class="muted"></span>
        <input id="ratio" type="range" min="0" max="100" step="5">
      </label>
      <label>日付<input id="date" type="date" required></label>
      <label>メモ<input id="memo" type="text" placeholder="例：イオン"></label>
      <div class="row gap">
        <button type="button" id="cancelEdit" class="ghost hidden">キャンセル</button>
        <button type="submit" class="primary grow" id="submitBtn">追加する</button>
      </div>
    </form>
  </section>

  <!-- 設定 -->
  <section id="tab-settings" class="tab">
    <div class="card">
      <h2>ふたりの名前</h2>
      <div class="row gap">
        <label class="grow">1人目<input id="nameA" type="text"></label>
        <label class="grow">2人目<input id="nameB" type="text"></label>
      </div>
    </div>
    <div class="card">
      <h2>カテゴリと負担割合</h2>
      <p class="muted small">スライダーは1人目の負担割合です。新しく入力する支出に使われます（過去の支出は変わりません）。</p>
      <div id="catSettings"></div>
      <div class="row gap"><input id="newCat" type="text" placeholder="新しいカテゴリ" class="grow"><button id="addCat" class="ghost">追加</button></div>
    </div>
    <div class="card">
      <h2>毎月の固定費</h2>
      <p class="muted small">家賃など毎月同じ支出を登録しておくと、月ごとにボタン1つで追加できます。</p>
      <ul id="fixedList" class="list"></ul>
      <div class="fixed-form">
        <select id="fxCat"></select>
        <input id="fxAmount" type="number" inputmode="numeric" placeholder="金額">
        <select id="fxPayer"></select>
        <input id="fxDay" type="number" min="1" max="28" value="1" title="日">
        <button id="addFixed" class="ghost">追加</button>
      </div>
    </div>
    <div class="card">
      <h2>データ</h2>
      <p class="muted small">データはこの端末のブラウザに保存されます。もう一人の端末と揃えるときは、書き出したファイルを送って「読み込む」してください（同じ支出は重複しません）。</p>
      <div class="row gap wrap">
        <button id="exportBtn" class="ghost">書き出す</button>
        <label class="ghost button">読み込む<input id="importFile" type="file" accept="application/json" hidden></label>
        <button id="exportCsv" class="ghost">CSV</button>
      </div>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="summary" class="active">📊<span>精算</span></button>
  <button data-tab="add">＋<span>入力</span></button>
  <button data-tab="settings">⚙︎<span>設定</span></button>
</nav>
<div id="toast" class="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
